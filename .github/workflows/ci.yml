name: CI/CD Pipeline (Lab 2 & Lab 3)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  build-test-lint-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff mypy pyinstaller

      - name: Run Linter and Type Check
        run: |
          ruff check lab2/ lab3/
          mypy lab2/ lab3/ --explicit-package-bases --ignore-missing-imports

      - name: Run Unit Tests & Verify Coverage (Lab 2)
        run: |
          python -m pytest --cov=lab2/domain --cov-fail-under=90 lab2/tests/

      - name: Run Unit Tests & Verify Coverage (Lab 3)
        run: |
          python -m pytest --cov=lab3/domain --cov-fail-under=90 lab3/tests/

      - name: Build Standalone Artifacts
        run: |
          # Сборка второй лабораторной
          pyinstaller --onefile --name ppois_lab2 lab2/cli.py
          
          # Безопасная попытка собрать третью лабу (если cli.py уже создан)
          if (Test-Path "lab3/cli.py") { 
            pyinstaller --onefile --name ppois_lab3 lab3/cli.py 
          } else {
            Write-Host "Файл lab3/cli.py пока не существует. Сборка пропущена."
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ppois_windows_builds
          path: dist/*.exe

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/lab2' || github.ref == 'refs/heads/feat/lab3'
        with:
          tag_name: latest-builds
          name: "Последние сборки (Lab 2 & Lab 3)"
          body: "Автоматически собранные исполняемые файлы для Windows."
          files: dist/*.exe