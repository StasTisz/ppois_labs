name: Lab 2 CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  build-test-lint-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Установка окружения Python и утилит
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tools
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff mypy pyinstaller

      # 2. Статический анализ кода (Линтер и типы)
      - name: Run Linter and Type Check
        run: |
          ruff check lab2/
          mypy lab2/ --explicit-package-bases --ignore-missing-imports

      # 3. Запуск unit-тестов и проверка покрытия (>90%)
      - name: Run Unit Tests & Verify Coverage
        run: |
          python -m pytest --cov=lab2/domain --cov-fail-under=90 lab2/tests/

      # 4. Сборка независимого бинарника (.exe) под Windows
      - name: Build Standalone Artifact
        run: |
          pyinstaller --onefile --name ppois_lab2 lab2/cli.py

      # 5. Сохранение артефакта сборки в CI
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppois_lab2_windows
          path: dist/ppois_lab2.exe

      # 6. Автоматическая публикация релиза с бинарником
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/lab2'
        with:
          tag_name: lab2-latest
          name: "Лабораторная работа 2 (Сборка .exe)"
          body: "Готовый исполняемый файл приложения под Windows."
          files: dist/ppois_lab2.exe